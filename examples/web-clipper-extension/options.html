<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save to Inkling — options</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; }
      input { width: 100%; padding: 6px; box-sizing: border-box; }
      p { color: #555; }
    </style>
  </head>
  <body>
    <label for="server">Inkling server address</label>
    <input id="server" type="url" placeholder="https://notes.example.com" />
    <p>The address you open Inkling at. Sign in there in this browser; the extension stores no password or token.</p>
    <button id="save">Save</button> <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
