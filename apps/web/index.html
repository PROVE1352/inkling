<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Inkling</title>
    <meta name="description" content="Self-hosted notes: Notion's collaboration with Obsidian's lightness, on your own server." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iPadOS home-screen app (standalone) + installable on Android (Galaxy Tab) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inkling" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191919" />
    <!-- Prevent a dark-mode FOUC (runs synchronously before React mounts). An external file, so CSP script-src 'self' suffices. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Replaced by React's first render. Shown only if the app has not started after 12 s (its script
         failed to load or run): a notice with a reload link instead of a blank page (docs/adr/2324-*). -->
    <div id="root"><div class="nd-boot-fallback" data-testid="boot-fallback">
      <p>Inkling is taking longer than usual to start. <a href="">Reload the page</a></p>
      <p lang="ko">Inkling을 여는 데 평소보다 오래 걸립니다. <a href="">페이지 새로고침</a></p>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
