name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues do not belong here** - see SECURITY.md.
        Please remove secrets (tokens, cookies, `.env` values, signup keys) from logs before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page with ...
        2. Type ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / real-time collaboration
        - Pages, databases, canvas
        - Search, graph, queries
        - Markdown import/export, vault sync (inklingctl)
        - Accounts, auth, sharing
        - Plugins
        - Backup, deployment, Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Inkling?
      options:
        - Docker Compose (deploy/)
        - Local development (pnpm dev)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari 19 on iPadOS, Chrome 140 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines (`docker compose logs app`) and browser console output around the failure.
      render: shell
