# Continuous integration. Rationale for the job split: docs/adr/0881-ci-composition.md
#
#   check   - install (frozen lockfile), editor pin check, typecheck, unit tests, server + web build
#   db      - Postgres 16 service, migrations, full test suite including the [db] suites
#   docker  - builds the production image from the Dockerfile (never pushed)
#
# Reproduce locally: see "Running CI locally" in CONTRIBUTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  # Telemetry / interactive prompts off; keeps logs short and deterministic.
  CI: 'true'

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No `version:` - the action reads the exact pin from package.json `packageManager`
      # (pnpm@11.25.0). A floating `pnpm@11` once pointed at a broken release (see Dockerfile).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree; the lockfile is
      # never rewritten in CI.
      - run: pnpm install --frozen-lockfile

      - name: Editor dependency pins (BlockNote / prosemirror-view)
        run: pnpm check:pins

      - name: Typecheck
        run: pnpm -r typecheck

      # DATABASE_URL is deliberately unset here: [db] suites skip and run in the `db` job.
      - name: Unit tests
        run: pnpm -r test

      - name: Build server (tsup)
        run: pnpm --filter @inkling/server build

      - name: Build web (vite)
        run: pnpm --filter @inkling/web build

  db:
    name: Database tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same major as compose.yaml. The official image ships contrib (pg_trgm, used by
        # migrations 0007 and 0024) and the default user is a superuser, so CREATE EXTENSION works.
        image: postgres:16
        env:
          POSTGRES_USER: inkling
          POSTGRES_PASSWORD: inkling
          POSTGRES_DB: inkling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkling -d inkling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://inkling:inkling@localhost:5432/inkling_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # drizzle-kit applies apps/server/drizzle/* with the same journal table the app's boot-time
      # migrator uses, so a migration that breaks here would also break server start-up.
      - name: Migrate
        run: pnpm db:migrate

      # test:db refuses to run without DATABASE_URL, so the [db] suites cannot silently skip.
      - name: Tests including [db] suites
        run: pnpm test:db

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: inkling:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
