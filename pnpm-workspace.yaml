packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  "@node-rs/argon2": true
  "@tailwindcss/oxide": true

patchedDependencies:
  "@blocknote/core@0.51.4": patches/@blocknote__core@0.51.4.patch

overrides:
  prosemirror-view: "1.42.4"

# pdfjs-dist (web, docs/adr/2480-*) lists @napi-rs/canvas as an optional dependency for rendering in
# Node; the browser never uses it, and installing it would also satisfy unpdf's optional peer on the server.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
