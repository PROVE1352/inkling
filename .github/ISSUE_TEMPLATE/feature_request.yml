name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Mockups or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This would change the data format, sync protocol or a public API (needs an ADR, see CONTRIBUTING.md).
        - label: I am willing to open a pull request for this.
