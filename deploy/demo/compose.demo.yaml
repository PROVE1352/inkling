# Demo instance overlay (restricted mode, 0.22; docs/DEMO.md). A separate Inkling server for strangers to
# try: its own compose project, database, volumes, network and port, with the demo limits switched on.
# Start, stop and check it only with deploy/demo/demo.sh (it fixes the project name, ignores the shell's
# variables and refuses to act when the result does not look like the demo):
#
#   cp deploy/demo/demo.env.example deploy/demo/demo.env      # then fill in the secrets and the URL
#   deploy/demo/demo.sh up
#
# compose.yaml stays the base (same image, backups and health checks); this file only adds to it.
# Every name the production instance also has (compose project, volumes, network, database role and
# database) is written out here as the demo's own and never read from a variable: an exported
# COMPOSE_PROJECT_NAME or INKLING_DATA_NAME in the shell cannot point the demo at production's data
# (0.22 security fix F7, docs/adr/2538-*). The secrets have demo-only variable names (DEMO_*).
# Every demo setting below is required (`:?`): with a missing line, or with the production .env, compose
# refuses to start instead of opening an unlimited public server.
#
# 0.22.1 (contract §15, review N8, docs/adr/2546-*): the app runs the demo's own image name (DEMO_IMAGE,
# e.g. inkling-demo:local), so building or pulling for the demo never replaces the image production's
# next `up` would use; and every demo volume is a folder under DEMO_VOLUME_ROOT, where the operator mounts
# a filesystem with its own size and inode limits (docs/DEMO.md, "A filesystem for the demo's data"):
# what a demo user writes cannot fill the disk production lives on.
name: inkling-demo

x-demo-limits: &demo-limits
  # compose.yaml passes the 0.22 settings as optional (empty = off); here each one is required, so the demo
  # cannot start with one missing. Meanings: docs/DEMO.md and .env.example.
  LOGIN_ID_MODE: ${LOGIN_ID_MODE:?set in deploy/demo/demo.env}
  SIGNUP_MAX_USERS: ${SIGNUP_MAX_USERS:?set in deploy/demo/demo.env}
  SIGNUP_PER_IP_PER_DAY: ${SIGNUP_PER_IP_PER_DAY:?set in deploy/demo/demo.env}
  ACCOUNT_LIFETIME_DAYS: ${ACCOUNT_LIFETIME_DAYS:?set in deploy/demo/demo.env}
  ACCOUNT_LIFETIME_DRY_RUN: ${ACCOUNT_LIFETIME_DRY_RUN:-}
  LIMIT_WORKSPACES_PER_USER: ${LIMIT_WORKSPACES_PER_USER:?set in deploy/demo/demo.env}
  LIMIT_MEMBERS_PER_WORKSPACE: ${LIMIT_MEMBERS_PER_WORKSPACE:?set in deploy/demo/demo.env}
  LIMIT_PAGES_PER_WORKSPACE: ${LIMIT_PAGES_PER_WORKSPACE:?set in deploy/demo/demo.env}
  LIMIT_FILE_MB: ${LIMIT_FILE_MB:?set in deploy/demo/demo.env}
  LIMIT_WORKSPACE_STORAGE_MB: ${LIMIT_WORKSPACE_STORAGE_MB:?set in deploy/demo/demo.env}
  LIMIT_VERSIONS_PER_PAGE: ${LIMIT_VERSIONS_PER_PAGE:?set in deploy/demo/demo.env}
  LIMIT_TRASH_DAYS: ${LIMIT_TRASH_DAYS:?set in deploy/demo/demo.env}
  WORKSPACE_RESTORE_DAYS: ${WORKSPACE_RESTORE_DAYS:?set in deploy/demo/demo.env}
  DISABLED_FEATURES: ${DISABLED_FEATURES:?set in deploy/demo/demo.env}
  INSTANCE_LABEL: ${INSTANCE_LABEL:?set in deploy/demo/demo.env}
  # The operator's notice on every screen (changes, outages, incidents): optional, empty = none.
  INSTANCE_NOTICE: ${INSTANCE_NOTICE:-}
  # The folder mounted below; the server refuses to boot when it is missing or malformed.
  LEGAL_DIR: /legal
  # Already passed by compose.yaml, repeated as required here so the demo cannot start without them.
  SIGNUP_REQUIRE_KEY: ${SIGNUP_REQUIRE_KEY:?set in deploy/demo/demo.env}
  AGENT_UPLOAD_MAX_MB: ${AGENT_UPLOAD_MAX_MB:?set in deploy/demo/demo.env}
  AGENT_UPLOAD_DAILY_MB: ${AGENT_UPLOAD_DAILY_MB:?set in deploy/demo/demo.env}
  PUBLIC_URL: ${PUBLIC_URL:?set in deploy/demo/demo.env}
  TRUST_PROXY: ${TRUST_PROXY:?set in deploy/demo/demo.env}
  # The demo's own database and secret (never production's: docs/DEMO.md, "Secrets").
  DATABASE_URL: postgres://inkling_demo:${DEMO_POSTGRES_PASSWORD:?set in deploy/demo/demo.env}@db:5432/inkling_demo
  APP_SECRET_KEY: ${DEMO_APP_SECRET_KEY:?set in deploy/demo/demo.env}
  # Set only by deploy/demo/demo.sh: plain `docker compose` with this file stops here, because the shell's
  # COMPOSE_PROJECT_NAME would still name the project (and replace production's containers on `up`).
  DEMO_VIA_SCRIPT: ${DEMO_VIA_SCRIPT:?start, stop and check the demo with deploy/demo/demo.sh (docs/DEMO.md)}
  # Settings added after the security review (contract §14).
  SIGNUP_PER_HOUR: ${SIGNUP_PER_HOUR:?set in deploy/demo/demo.env}
  OAUTH_UNUSED_CLIENT_HOURS: ${OAUTH_UNUSED_CLIENT_HOURS:?set in deploy/demo/demo.env}
  OAUTH_UNUSED_CLIENT_MAX: ${OAUTH_UNUSED_CLIENT_MAX:?set in deploy/demo/demo.env}
  LIMIT_WORKSPACES_TOTAL: ${LIMIT_WORKSPACES_TOTAL:?set in deploy/demo/demo.env}
  LIMIT_INSTANCE_STORAGE_MB: ${LIMIT_INSTANCE_STORAGE_MB:?set in deploy/demo/demo.env}

services:
  app:
    # The demo's own image name (never production's ghcr.io/prove1352/inkling tag): `up` builds it from this
    # checkout when it is not on the machine, `demo.sh build` rebuilds it (demo.sh refuses a name without
    # "demo" in it).
    image: ${DEMO_IMAGE:?set in deploy/demo/demo.env}
    environment: *demo-limits
    # The demo's own host port (production's default is 3000; demo.sh refuses 3000).
    ports: !override
      - "${DEMO_PORT:?set in deploy/demo/demo.env}:3000"
    volumes:
      # Terms, privacy policy and sign-up texts (deploy/demo/legal is the template with placeholders).
      - ${DEMO_LEGAL_DIR:?set in deploy/demo/demo.env}:/legal:ro
    mem_limit: ${APP_MEM_LIMIT:?set in deploy/demo/demo.env}
    # No swap past the memory limit (0.22.1): without this a container may also use as much swap again,
    # on the host's swap device. demo.sh refuses a service whose memswap_limit differs from its mem_limit.
    memswap_limit: ${APP_MEM_LIMIT:?set in deploy/demo/demo.env}
    cpus: ${APP_CPUS:?set in deploy/demo/demo.env}
    pids_limit: ${APP_PIDS_LIMIT:?set in deploy/demo/demo.env}

  db:
    environment:
      POSTGRES_USER: inkling_demo
      POSTGRES_DB: inkling_demo
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?set in deploy/demo/demo.env}
      PGUSER: inkling_demo
      PGDATABASE: inkling_demo
    mem_limit: ${PG_MEM_LIMIT:?set in deploy/demo/demo.env}
    memswap_limit: ${PG_MEM_LIMIT:?set in deploy/demo/demo.env}
    cpus: ${PG_CPUS:?set in deploy/demo/demo.env}
    pids_limit: ${PG_PIDS_LIMIT:?set in deploy/demo/demo.env}
    # The demo database is never published on the host (Docker-internal traffic only).
    ports: !override []

  backup:
    # compose.yaml's 256m, written out here so its swap limit can match it
    mem_limit: 256m
    memswap_limit: 256m
    cpus: ${BACKUP_CPUS:?set in deploy/demo/demo.env}
    pids_limit: ${BACKUP_PIDS_LIMIT:?set in deploy/demo/demo.env}
    environment:
      PGUSER: inkling_demo
      PGDATABASE: inkling_demo
      PGPASSWORD: ${DEMO_POSTGRES_PASSWORD:?set in deploy/demo/demo.env}
      BACKUP_PASSPHRASE: ${DEMO_BACKUP_PASSPHRASE:-}
      # Backups follow the privacy policy: daily sets for 7 days, no weekly or monthly sets.
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:?set in deploy/demo/demo.env}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:?set in deploy/demo/demo.env}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:?set in deploy/demo/demo.env}

# Each volume is a bind of a folder under DEMO_VOLUME_ROOT (an absolute path on a filesystem of its own;
# demo.sh checks it and makes the four folders before `up`). The names stay the demo's own.
volumes:
  db:
    name: inkling-demo_db
    driver: local
    driver_opts: { type: none, o: bind, device: "${DEMO_VOLUME_ROOT:?set in deploy/demo/demo.env}/db" }
  data:
    name: inkling-demo_data
    driver: local
    driver_opts: { type: none, o: bind, device: "${DEMO_VOLUME_ROOT:?set in deploy/demo/demo.env}/data" }
  backups:
    name: inkling-demo_backups
    driver: local
    driver_opts: { type: none, o: bind, device: "${DEMO_VOLUME_ROOT:?set in deploy/demo/demo.env}/backups" }
  backup-ctl:
    name: inkling-demo_backup-ctl
    driver: local
    driver_opts: { type: none, o: bind, device: "${DEMO_VOLUME_ROOT:?set in deploy/demo/demo.env}/backup-ctl" }

networks:
  default:
    name: inkling-demo_net
