# Fixed compose project name: if it were derived from the directory name (inkling), the volume
# names would change and the existing DB/uploads would be swapped for new empty volumes. The app
# is called Inkling, but the data plumbing below (project/volumes/DB/role) keeps the nodian name
# so no migration is needed.
name: nodian

# Container stdout log rotation: the default json-file driver is unbounded (100MB+ in two weeks).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    # Memory/planner settings (docs/adr/0758-*, docs/OPERATIONS.md "PostgreSQL tuning").
    # Defaults are deliberately small (safe on a 1 GB box); a larger-host example (4 cores / 24 GB,
    # shared with other services) is in OPERATIONS.md — set the PG_* variables in .env.
    # shared_buffers / shared_preload_libraries need a container restart to change.
    mem_limit: ${PG_MEM_LIMIT:-512m}
    # Parallel query uses /dev/shm (docker default 64 MB is too small for parallel hash joins).
    shm_size: ${PG_SHM_SIZE:-128m}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-384MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      # SSD/NVMe block storage: random reads are ~as cheap as sequential ones. With the stock 4.0
      # the planner prefers seq scans over the trigram indexes (docs/adr/0755-*).
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-100}
      - -c
      - track_io_timing=on
      # Opt-in query statistics: PG_PRELOAD_LIBRARIES=pg_stat_statements, then once
      # `CREATE EXTENSION pg_stat_statements;` (see OPERATIONS.md).
      - -c
      - shared_preload_libraries=${PG_PRELOAD_LIBRARIES:-}
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_USER: nodian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodian}
      POSTGRES_DB: nodian
    ports:
      # Host exposure for development (55432 → 5432), on a non-standard port to avoid clashes.
      # Bound to loopback only so the DB port is never reachable from outside (H2).
      - "127.0.0.1:55432:5432"
    volumes:
      - nodian-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodian -d nodian"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    logging: *default-logging
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-768m}
    # On SIGTERM the server flushes pending collaborative docs to the DB (~25 s worst case)
    # before exiting; docker's default 10 s would SIGKILL it mid-flush.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # Every server env var is passed through; an empty value means "server default".
    # Deliberately NOT passed (the Dockerfile sets them and the server reads them with `??`,
    # so an empty string from compose would override the image value and break the app):
    # PORT, DATA_DIR, WEB_DIST, DRIZZLE_DIR. BACKUP_DIR / BACKUP_CTL_DIR are fixed by the
    # volume mounts below, and WEBHOOK_TEST_ALLOW_LOOPBACK is test-only (ignored in production).
    environment:
      DATABASE_URL: postgres://nodian:${POSTGRES_PASSWORD:-nodian}@db:5432/nodian
      # Interpolated from .env AND the invoking shell: an exported NODE_ENV=development in the
      # operator's shell would silently turn production mode off. Leave it unset there.
      NODE_ENV: ${NODE_ENV:-production}
      # V8 heap cap below mem_limit so the GC works harder before the cgroup OOM-kills the
      # process (heap + Buffers/Yjs off-heap + code ≈ RSS). Keep it ~65% of APP_MEM_LIMIT.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      # 1 = Secure cookies. The server also forces Secure automatically when PUBLIC_URL starts
      # with https:// (deploy/compose.caddy.yaml sets 1).
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Comma-separated feature flags; plugin directory (default <DATA_DIR>/plugins);
      # extra CSP frame-src origins for embeds; version shown in the UI/backups (default package.json).
      EXPERIMENTAL_FEATURES: ${EXPERIMENTAL_FEATURES:-}
      PLUGINS_DIR: ${PLUGINS_DIR:-}
      EMBED_EXTRA_FRAME_SRC: ${EMBED_EXTRA_FRAME_SRC:-}
      APP_VERSION: ${APP_VERSION:-}
      # Most pages one import may create (default 5000).
      IMPORT_MAX_PAGES: ${IMPORT_MAX_PAGES:-}
      IMPORT_MAX_UPLOAD_MB: ${IMPORT_MAX_UPLOAD_MB:-}
      IMPORT_MAX_UNPACKED_MB: ${IMPORT_MAX_UNPACKED_MB:-}
      IMPORT_MAX_ENTRY_MB: ${IMPORT_MAX_ENTRY_MB:-}
      IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-}
      # Delegated login / signup keys (see .env.example)
      DELEGATED_AUTH_URL: ${DELEGATED_AUTH_URL:-}
      DELEGATED_AUTH_NAME: ${DELEGATED_AUTH_NAME:-}
      DELEGATED_EMAIL_DOMAIN: ${DELEGATED_EMAIL_DOMAIN:-}
      # With NODE_ENV=production an unset/empty value REQUIRES a signup key; only an explicit
      # SIGNUP_REQUIRE_KEY=0 opens public signup.
      SIGNUP_REQUIRE_KEY: ${SIGNUP_REQUIRE_KEY:-}
      # Outgoing mail / email verification
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      # Brute-force protection (empty = defaults)
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOWLIST_IPS: ${ALLOWLIST_IPS:-}
      AUTH_GUARD_WINDOW_MINUTES: ${AUTH_GUARD_WINDOW_MINUTES:-}
      AUTH_GUARD_MAX_FAILURES: ${AUTH_GUARD_MAX_FAILURES:-}
      AUTH_GUARD_BAN_MINUTES: ${AUTH_GUARD_BAN_MINUTES:-}
      AUTH_GUARD_BAN_MAX_HOURS: ${AUTH_GUARD_BAN_MAX_HOURS:-}
      AUTH_GUARD_ACCOUNT_FAILURES: ${AUTH_GUARD_ACCOUNT_FAILURES:-}
      # Language for emails/built-in templates of users who have not picked one, and the web UI
      # default before the browser language (en | ko; default en). docs/adr/0901-*, 0903-*.
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-}
      # Container time zone: decides "today" for due reminders, daily notes and the due view, and
      # the times shown in emails. Default UTC; set TZ in .env (e.g. Asia/Seoul) to match users.
      TZ: ${TZ:-UTC}
    ports:
      - "3000:3000"
    volumes:
      - nodian-data:/data
      # Backups (docs/BACKUP.md): the app only reads backup sets/status and drops trigger files.
      - nodian-backups:/backups:ro
      - nodian-backup-ctl:/backup-ctl
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Scheduled backups of the database + data volume (docs/BACKUP.md, docs/adr/0600-*).
  # Enabled by default; BACKUP_ENABLED=0 turns it into a no-op. The pg_dump major version must
  # match the db service (postgres 16). Remote copies: add deploy/compose.backup-rclone.yaml.
  backup:
    image: postgres:16
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: nodian
      PGDATABASE: nodian
      PGPASSWORD: ${POSTGRES_PASSWORD:-nodian}
      TZ: ${TZ:-UTC}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-daily@03:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_RESTORE_TEST_DAYS: ${BACKUP_RESTORE_TEST_DAYS:-7}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-256}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - ./deploy/backup:/scripts:ro
      - nodian-data:/data:ro
      - nodian-backups:/backups
      - nodian-backup-ctl:/backup-ctl

volumes:
  nodian-db:
  nodian-data:
  nodian-backups:
  nodian-backup-ctl:
