<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Inkling</title>
    <meta name="description" content="Self-hosted notes: Notion's collaboration with Obsidian's lightness, on your own server." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inkling" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191919" />

    <script src="/theme-init.js"></script>
